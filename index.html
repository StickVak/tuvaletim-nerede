<!doctype html>
<html lang="tr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, viewport-fit=cover" />
    <!-- Durum çubuğu = uygulama zemini (açık #FFFFFF / koyu #1E1E1E); koyu tema aşağıdaki betikte uygulanır -->
    <meta name="theme-color" content="#FFFFFF" />
    <meta name="description" content="Yakınındaki en temiz ve ücretsiz tuvaleti saniyeler içinde bul." />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <!-- iOS ana ekran: tam ekran, durum çubuğu saydam (içerik env(safe-area-inset-*) ile hizalanır) -->
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Tuvaletim" />
    <link rel="icon" type="image/png" href="/favicon.png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/manifest.json" />
    <link rel="privacy-policy" href="/gizlilik-politikasi" />
    <link rel="terms-of-service" href="/hizmet-sartlari" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
    <title>Tuvaletim Nerede?</title>
    <script>
      // Boyamadan önce temayı uygula (beyaz yanıp sönmeyi önler) — src/hooks/useTheme.ts ile aynı kural
      try { var t = localStorage.getItem('tn.theme'); if (t === 'dark' || (t !== 'light' && matchMedia('(prefers-color-scheme: dark)').matches)) { document.documentElement.classList.add('dark'); document.querySelector('meta[name="theme-color"]').setAttribute('content', '#1E1E1E'); } } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <noscript>
      <h1>Tuvaletim Nerede?</h1>
      <p>Yakınındaki en temiz ve ücretsiz tuvaleti saniyeler içinde bul. Uygulamayı kullanmak için JavaScript'i etkinleştirin.</p>
      <p><a href="/hizmet-sartlari">Hizmet Şartları</a> · <a href="/gizlilik-politikasi">Gizlilik Politikası</a></p>
    </noscript>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
